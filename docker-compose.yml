version: "3.8"

networks:
  app_network:
    driver: bridge

services:
  frontend:
    build: ./frontend
    container_name: react_app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: flask_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./backend:/app
    networks:
      - app_network
