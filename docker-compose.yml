version: "3"
services:
  postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: flaskia
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@pg.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build: ./client
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      FLASK_DEBUG: 1
      FLASK_APP: src/__init__.py
      FLASK_RUN_HOST: 0.0.0.0
      DATABASE_URL: postgresql://admin:admin@postgres:5432/flaskia

volumes:
  postgres_data:
  pgadmin_data:
