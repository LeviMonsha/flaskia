<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
  </head>
  <body>
    <header class="bg-gray-100 py-4 shadow-md">
      <nav class="container mx-auto flex justify-end">
        Микроблог:
        <a href="{{ url_for('home.home_page') }}">Домой</a>
        {% if current_user.is_anonymous %}
        <a href="{{ url_for('auth.auth_page') }}">Войти</a>
        {% else %}
        <a href="{{ url_for('home.logout') }}">Выйти</a>
        {% endif %}
      </nav>
    </header>
    <main class="container mx-auto p-10 mt-10">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
